<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f9fc">
  <title>Page not found — Sebastian Belalcazar</title>
  <link rel="icon" href="/assets/brand-icon.ico" type="image/x-icon">
  <style>
    @font-face{font-family:Bricolage;src:url('/assets/fonts/bricolage-700.ttf') format('truetype');font-weight:700;font-display:swap}
    @font-face{font-family:'DM Sans';src:url('/assets/fonts/dm-sans-400.ttf') format('truetype');font-weight:400;font-display:swap}
    @font-face{font-family:'DM Sans';src:url('/assets/fonts/dm-sans-600.ttf') format('truetype');font-weight:600;font-display:swap}
    :root{--paper:#f7f9fc;--ink:#18232c;--muted:#5a6573;--gold:#c9a24b;--gold-ink:#82611f;--line:#dce2e9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 18px/1.7 'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none;touch-action:manipulation}
    a:focus-visible{outline:3px solid var(--gold-ink);outline-offset:6px}
    ::selection{background:#f3e8ca;color:var(--ink)}
    .shell{width:min(1192px,calc(100% - 96px));margin-inline:auto}
    header{padding-block:24px;border-bottom:1px solid var(--line)}
    .brand{display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:600;min-height:44px}
    .brand-icon{display:grid;place-items:center;width:40px;height:40px;background:var(--ink);border-radius:10px}
    .brand-icon img{width:22px;height:30px;object-fit:contain}
    .brand-dot{color:var(--gold-ink)}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-block:80px 112px}
    .code{display:flex;align-items:center;gap:14px;color:var(--gold-ink);font-size:16px;font-weight:600;letter-spacing:.12em;margin:0 0 24px}
    .code::before{content:'';width:48px;height:3px;background:var(--gold)}
    h1{font:700 clamp(42px,6vw,76px)/1.06 Bricolage,Arial,sans-serif;letter-spacing:-.045em;max-width:750px;margin:0;text-wrap:balance}
    .description{color:var(--muted);margin:26px 0 0;max-width:560px}
    .actions{display:flex;align-items:center;flex-wrap:wrap;gap:20px 32px;margin-top:36px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:51px;padding:12px 22px;border:1px solid var(--gold);border-radius:8px;background:var(--gold);font-size:16px;font-weight:600;line-height:1.5}
    .button:hover{background:#dab765;border-color:#dab765}
    .text-link{display:inline-flex;align-items:center;min-height:44px;font-size:16px;font-weight:600;text-decoration:underline;text-underline-offset:5px}
    .text-link:hover{color:var(--gold-ink)}
    @media(max-width:640px){.shell{width:calc(100% - 40px)}header{padding-block:18px}main{padding-block:64px 88px}h1{font-size:44px}.description{font-size:16px}.actions{align-items:flex-start;flex-direction:column;gap:16px;margin-top:30px}}
  </style>
</head>
<body>
  <header><div class="shell"><a class="brand" href="/" aria-label="SEBASBELMOS — Home" id="brand"><span class="brand-icon" aria-hidden="true"><img src="/assets/brand-icon.ico" alt="" width="22" height="30"></span><span>SEBASBELMOS<span class="brand-dot">.</span></span></a></div></header>
  <main class="shell" aria-labelledby="page-title">
    <p class="code">404</p>
    <h1 id="page-title">This page doesn't exist.</h1>
    <p class="description" id="page-description">The link may be old or mistyped.</p>
    <div class="actions"><a class="button" href="/" id="home-link">Go to the homepage</a><a class="text-link" href="/#contact" id="contact-link">Discuss your project</a></div>
  </main>
  <script>
    (() => {
      let language=(navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
      try {
        const saved=localStorage.getItem('sebasbelmos-lang');
        if (saved==='en' || saved==='es') language=saved;
      } catch { /* The page also works when storage is unavailable. */ }
      document.documentElement.lang=language;
      if (language==='es') {
        document.title='Página no encontrada — Sebastian Belalcazar';
        document.getElementById('brand').setAttribute('aria-label','SEBASBELMOS — Inicio');
        document.getElementById('page-title').textContent='Esta página no existe.';
        document.getElementById('page-description').textContent='Puede que el enlace sea antiguo o tenga un error.';
        document.getElementById('home-link').textContent='Ir al inicio';
        document.getElementById('contact-link').textContent='Hablemos de tu proyecto';
      }
    })();
  </script>
</body>
</html>
